name: beam
description: Beam — a fast, ad-free flashlight for Android.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  screen_brightness: ^2.1.0
  wakelock_plus: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-400.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-500.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-800.ttf
          weight: 800
    - family: MartianMono
      fonts:
        - asset: assets/fonts/MartianMono-400.ttf
          weight: 400
        - asset: assets/fonts/MartianMono-500.ttf
          weight: 500
